<!doctype html>
<html lang="en-us">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: https:; connect-src 'none'">
		<title>Minecraft Mod Updater</title>
		<link rel="stylesheet" href="lib/main.css">
		<link rel="icon" href="lib/favicon.png" type="image/png">
	</head>

	<body>
		<label id="settings-button"><input type="checkbox" id="settings-toggle"></label>
		<div id="main">
			<h1>Minecraft Mod Updater</h1>
			<span>Import local JAR files, identify them, and download compatible versions.</span>
			<div class="toolbar panel">
				<div class="toolbar-row">
					<button id="import-files">Import files</button>
					<button id="import-files-folder">Import files from folder</button>
					<button id="clear-import-files">Clear imported files</button>
				</div>
				<div class="toolbar-row after-import">
					<button id="reload">Reload</button>
					<button id="start-search">Search for target version</button>
					<button id="export-summary">Export summary</button>
				</div>
			</div>
			<div id="status"></div>
			<div class="search-filter panel">
				<span class="field-label">Search <input id="search-query" placeholder="Name or JAR name"></span>
				<span class="field-label">Filter <span class="select-with-custom">
						<select id="source-filter">
							<option value="all">Source: All</option>
							<option value="found">Source: Found</option>
							<option value="not-found">Source: Not Found</option>
						</select>
						<select id="target-filter">
							<option value="all">Target: All</option>
							<option value="found">Target: Found</option>
							<option value="not-found">Target: Not Found</option>
						</select>
					</span>
				</span>
			</div>
			<div id="operation-panel"></div>
		</div>
		<div id="settings">
			<h1>Minecraft Mod Updater - Settings</h1>
			<div class="settings-panel panel">
				<span class="field-label">Target Game Version <span class="select-with-custom">
						<select id="target-version-select">
							<option value="other">Other</option>
						</select>
						<input id="target-version" placeholder="Game version">
					</span>
				</span>
				<span class="field-label">Target Loader <span class="select-with-custom">
						<select id="target-loader">
							<option value="other">Other</option>
							<option value="fabric">Fabric</option>
							<option value="forge">Forge</option>
							<option value="neoforge">NeoForge</option>
							<option value="quilt">Quilt</option>
						</select>
						<input id="target-loader-custom" placeholder="loader">
					</span>
				</span>
				<span class="field-label">Minimum Release Level <select id="minimum-release">
						<option value="release">Release only</option>
						<option value="beta">Beta or release</option>
						<option value="alpha">Alpha, beta, or release</option>
					</select>
				</span>
				<span class="field-label">Release Level Fallback <select id="release-level-fallback">
						<option value="disabled">Disabled</option>
						<option value="allow-lower">Allow Lower Release Levels</option>
					</select>
				</span>
			</div>
		</div>
		<script src="lib/main.js"></script>
	</body>

</html>
